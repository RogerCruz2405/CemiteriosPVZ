<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cemitérios — Consulta de Inumações</title>
<style>
  :root{
    --ink:#1c2b26;
    --paper:#f4f2ec;
    --panel:#ffffff;
    --line:#d9d4c6;
    --moss:#3d5c4c;
    --moss-dark:#2a4136;
    --clay:#a4623f;
    --muted:#7a7568;
    --s-yes:#3d5c4c;
    --s-no:#a4623f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Iowan Old Style","Georgia",serif;
    background:var(--paper);
    color:var(--ink);
  }
  header{
    background:var(--moss-dark);
    color:#eee8d8;
    padding:28px 32px 22px;
    border-bottom:4px solid var(--clay);
  }
  header h1{
    margin:0 0 4px;
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:.01em;
  }
  header p{
    margin:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.82rem;
    color:#c7cabb;
    letter-spacing:.03em;
    text-transform:uppercase;
  }
  main{
    max-width:1080px;
    margin:0 auto;
    padding:28px 24px 60px;
  }
  .search-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  .modes{
    display:flex;
    gap:6px;
    margin-bottom:12px;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .modes button{
    flex:1;
    padding:9px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    font-size:.85rem;
    font-weight:600;
    letter-spacing:.02em;
    cursor:pointer;
    border-radius:8px;
    transition:.15s;
  }
  .modes button.active{
    background:var(--moss);
    border-color:var(--moss);
    color:#fff;
  }
  .search-row{
    display:flex;
    gap:10px;
  }
  input#q{
    flex:1;
    font-family:inherit;
    font-size:1.05rem;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    color:var(--ink);
    outline:none;
  }
  input#q:focus{border-color:var(--moss);}
  .hint{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.76rem;
    color:var(--muted);
    margin:8px 2px 0;
  }
  .count{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.8rem;
    color:var(--muted);
    margin:18px 2px 8px;
  }
  .count b{color:var(--ink);}
  .cards{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:4px solid var(--moss);
    border-radius:8px;
    padding:14px 18px;
  }
  .card.transladado{border-left-color:var(--clay);}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  .name{
    font-size:1.08rem;
    font-weight:600;
  }
  .key-facts{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.85rem;
    color:var(--moss-dark);
    font-weight:600;
    white-space:nowrap;
  }
  .badge{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .badge.yes{background:rgba(61,92,76,.12);color:var(--s-yes);}
  .badge.no{background:rgba(164,98,63,.12);color:var(--s-no);}
  .code{
    font-family:"SF Mono","Menlo",monospace;
    font-size:.95rem;
    color:var(--moss-dark);
    font-weight:600;
  }
  .meta{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.82rem;
    color:var(--muted);
    margin-top:8px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:4px 16px;
  }
  .meta span b{color:var(--ink);font-weight:600;}
  .translado-note{
    margin-top:8px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.8rem;
    color:var(--clay);
  }
  .empty{
    text-align:center;
    padding:50px 10px;
    color:var(--muted);
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:.9rem;
  }
</style>
</head>
<body>
<header>
  <h1>Consulta de Inumações</h1>
  <p>Cemitérios Municipais — Póvoa de Varzim</p>
  <p id="estado-dados" style="margin-top:6px;font-size:.72rem;color:#9a9a86;">A carregar dados…</p>
</header>
<main>
  <div class="search-panel">
    <div class="modes">
      <button id="mode-nome" class="active">Por nome</button>
      <button id="mode-local">Por local (código)</button>
    </div>
    <div class="search-row">
      <input id="q" type="text" placeholder="Escreva um nome..." autocomplete="off">
    </div>
    <p class="hint" id="hint">Mostra-se sempre o local atual (LOCAL = S). Registos com "Transladado" já não estão nesse local.</p>
  </div>

  <p class="count" id="count"></p>
  <div class="cards" id="results"></div>
</main>

<script>
let DADOS = [];

// --- Leitura do dados.csv (exportado diretamente da folha "Registo Geral") ---

const MAPA_CABECALHOS = {
  'CODIGO': 'c', 'ID_DEF': 'id', 'NOME': 'n', 'IDADE': 'idd', 'A/M/D/H': 'u',
  'SEXO': 'sx', 'ESTADO CIVIL': 'ec', 'FALECIMENTO': 'fa', 'INUMACAO': 'inu',
  'GAVETAO': 'ga', 'OSSADAS': 'os', 'LOCALIZAÇÃO ATUAL': 'loc',
  'DESCRIÇÃO E OBSERVAÇÕES': 'desc', 'SITUAÇAO': 'sit', 'SITUAÇÃO': 'sit',
  'TRASLADACAO1': 't1', 'DATA1': 'd1', 'TRASLADACA02': 't2', 'DATA2': 'd2'
};

function detectarSeparador(primeiraLinha){
  const pontoVirgula = (primeiraLinha.match(/;/g) || []).length;
  const virgula = (primeiraLinha.match(/,/g) || []).length;
  return pontoVirgula > virgula ? ';' : ',';
}

// parser simples de CSV, respeita campos entre aspas com separadores/quebras de linha lá dentro
function parseCSV(texto){
  texto = texto.replace(/^\uFEFF/, ''); // remove BOM se existir
  const sep = detectarSeparador(texto.split('\n')[0] || '');
  const linhas = [];
  let campo = '', linha = [], dentroAspas = false;
  for(let i = 0; i < texto.length; i++){
    const ch = texto[i], prox = texto[i+1];
    if(dentroAspas){
      if(ch === '"' && prox === '"'){ campo += '"'; i++; }
      else if(ch === '"'){ dentroAspas = false; }
      else { campo += ch; }
    } else {
      if(ch === '"'){ dentroAspas = true; }
      else if(ch === sep){ linha.push(campo); campo = ''; }
      else if(ch === '\r'){ /* ignora */ }
      else if(ch === '\n'){ linha.push(campo); linhas.push(linha); campo=''; linha=[]; }
      else { campo += ch; }
    }
  }
  if(campo.length || linha.length){ linha.push(campo); linhas.push(linha); }
  return linhas.filter(l => l.some(c => c.trim() !== ''));
}

function normalizarData(v){
  if(!v) return '';
  v = v.trim();
  let m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);          // yyyy-mm-dd
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/); // dd/mm/yyyy ou dd-mm-yyyy
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return v;
}

function csvParaDados(texto){
  const linhas = parseCSV(texto);
  if(linhas.length < 2) return [];
  const cab = linhas[0].map(h => h.trim().toUpperCase());
  const idx = {};
  cab.forEach((h, i) => { if(MAPA_CABECALHOS[h]) idx[MAPA_CABECALHOS[h]] = i; });

  const dados = [];
  for(let i = 1; i < linhas.length; i++){
    const l = linhas[i];
    const codigo = idx.c !== undefined ? (l[idx.c] || '').trim() : '';
    if(!codigo) continue;
    const get = (k) => idx[k] !== undefined ? (l[idx[k]] || '').trim() : '';
    dados.push({
      c: codigo, id: get('id'), n: get('n'), idd: get('idd'), u: get('u'),
      sx: get('sx'), fa: normalizarData(get('fa')), inu: normalizarData(get('inu')),
      ga: get('ga'), os: get('os'), loc: get('loc'), desc: get('desc'),
      sit: get('sit'), t1: get('t1'), d1: normalizarData(get('d1')),
      t2: get('t2'), d2: normalizarData(get('d2'))
    });
  }
  return dados;
}

async function carregarDados(){
  try{
    const resp = await fetch('dados.csv', {cache:'no-store'});
    if(!resp.ok) throw new Error('dados.csv não encontrado');
    const texto = await resp.text();
    DADOS = csvParaDados(texto);
    document.getElementById('estado-dados').textContent =
      `${DADOS.length.toLocaleString('pt-PT')} registos carregados`;
  }catch(e){
    document.getElementById('estado-dados').textContent =
      'Não foi possível carregar dados.csv — confirma que está na mesma pasta que esta página.';
    document.getElementById('estado-dados').style.color = 'var(--clay)';
  }
  render();
}
carregarDados();

function normalize(s){
  return (s||'').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().trim();
}

let mode = 'nome';
const qInput = document.getElementById('q');
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('count');
const hintEl = document.getElementById('hint');
const btnNome = document.getElementById('mode-nome');
const btnLocal = document.getElementById('mode-local');

function setMode(m){
  mode = m;
  btnNome.classList.toggle('active', m==='nome');
  btnLocal.classList.toggle('active', m==='local');
  qInput.placeholder = m==='nome' ? 'Escreva um nome...' : 'Escreva um código de sepultura (ex: 1A002)...';
  hintEl.textContent = m==='nome'
    ? 'Pode usar * para saltar partes do nome — ex: "jo*sil*cos" encontra "JOAQUIM DA SILVA COSTA". Mostra-se sempre o local atual (LOCAL = S); "Transladado" já não está nesse local.'
    : 'Mostra todas as inumações registadas nesse código de sepultura ou jazigo.';
  render();
}
btnNome.addEventListener('click', () => setMode('nome'));
btnLocal.addEventListener('click', () => setMode('local'));

function fmtData(v){
  if(!v) return '';
  const [y,m,d] = v.split('-');
  return `${d}/${m}/${y}`;
}

function cardHtml(r){
  const isAqui = r.loc === 'S';
  const cls = isAqui ? '' : ' transladado';
  const badge = isAqui
    ? '<span class="badge yes">Local atual</span>'
    : '<span class="badge no">Transladado</span>';
  let transladoNote = '';
  if(!isAqui && (r.t1 || r.t2)){
    const destino = r.t2 || r.t1;
    const data = r.d2 || r.d1;
    transladoNote = `<div class="translado-note">Saiu para: ${destino}${data ? ' em ' + fmtData(data) : ''}</div>`;
  }
  return `
    <div class="card${cls}">
      <div class="card-top">
        <span class="name">${r.n || '(sem nome registado)'}</span>
        ${badge}
      </div>
      <div class="card-top" style="margin-top:2px;">
        <span class="key-facts">${r.idd || '—'} ${r.u || ''} &nbsp;·&nbsp; Faleceu em ${fmtData(r.fa) || '—'}</span>
      </div>
      <div class="card-top" style="margin-top:6px;">
        <span class="code">${r.c}</span>
        <span style="font-family:'Helvetica Neue',sans-serif;font-size:.78rem;color:var(--muted);">ID ${r.id || '—'}</span>
      </div>
      <div class="meta">
        <span><b>Sexo:</b> ${r.sx || '—'}</span>
        <span><b>Inumação:</b> ${fmtData(r.inu) || '—'}</span>
        <span><b>Gavetão:</b> ${r.ga || '—'}</span>
        <span><b>Ossadas:</b> ${r.os || '—'}</span>
        <span><b>Situação:</b> ${r.sit || '—'}</span>
      </div>
      ${transladoNote}
      ${r.desc ? `<div class="translado-note" style="color:var(--muted);">${r.desc}</div>` : ''}
    </div>`;
}

function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// "jo*sil*cos" -> encontra JO, depois SIL, depois COS, por esta ordem, com
// qualquer coisa (ou nada) entre eles. Sem "*" funciona como pesquisa normal.
function buildMatcher(term){
  if(term.indexOf('*') === -1){
    return (nomeNormalizado) => nomeNormalizado.includes(term);
  }
  const partes = term.split('*').filter(p => p.length > 0).map(escapeRegex);
  if(partes.length === 0){
    return () => true;
  }
  const re = new RegExp(partes.join('.*'));
  return (nomeNormalizado) => re.test(nomeNormalizado);
}

function render(){
  const raw = qInput.value;
  const term = normalize(raw);
  if(!term){
    resultsEl.innerHTML = '';
    countEl.textContent = '';
    return;
  }

  let matches;
  if(mode === 'nome'){
    const matchNome = buildMatcher(term);
    matches = DADOS.filter(r => matchNome(normalize(r.n)));
    // local atual primeiro, depois por nome
    matches.sort((a,b) => (b.loc==='S') - (a.loc==='S') || normalize(a.n).localeCompare(normalize(b.n)));
  } else {
    matches = DADOS.filter(r => normalize(r.c).includes(term));
    matches.sort((a,b) => normalize(a.c).localeCompare(normalize(b.c)) || (a.inu||'').localeCompare(b.inu||''));
  }

  if(matches.length === 0){
    resultsEl.innerHTML = '<div class="empty">Sem resultados.</div>';
    countEl.textContent = '';
    return;
  }

  const capped = matches.slice(0, 300);
  countEl.innerHTML = `<b>${matches.length}</b> resultado${matches.length===1?'':'s'}` +
    (matches.length > 300 ? ' — a mostrar os primeiros 300, afine a pesquisa' : '');
  resultsEl.innerHTML = capped.map(cardHtml).join('');
}

let debounceTimer;
qInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 90);
});
</script>
</body>
</html>
